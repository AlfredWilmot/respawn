---
- name: "Prepare Yocto build environment"

  hosts: builders

  tasks:
    - name: "Install Yocto deps"
      become: true
      ansible.builtin.package:
        name:
          - build-essential
          - chrpath
          - cpio
          - debianutils
          - diffstat
          - file
          - gawk
          - gcc
          - git
          - iputils-ping
          - libacl1
          - libcrypt-dev
          - locales
          - python3
          - python3-git
          - python3-jinja2
          - python3-pexpect
          - python3-pip
          - python3-subunit
          - python3-websockets
          - socat
          - texinfo
          - unzip
          - wget
          - xz-utils
          - zstd
        state: latest

    - name: "Ensure a locale exists"
      become: true
      community.general.locale_gen:
        name: en_US.UTF-8
        state: present

    - name: "Setup .venv"
      ansible.builtin.command:
        cmd: python3 -m venv "${HOME}/.venv"
        creates: "${HOME}/.venv/bin/activate"

    - name: "Install bitbake-setup via pip"
      ansible.builtin.pip:
        name: bitbake-setup
        state: present
        virtualenv: "${HOME}/.venv"

    - name: "Ensure bitbake-setup bin in .venv is in PATH"
      become: false
      ansible.builtin.lineinfile:
        path: ~/.bashrc
        regexp: "^export PATH=.*$"
        line: 'export PATH="${HOME}/.venv/bin:${PATH}"'
        state: present

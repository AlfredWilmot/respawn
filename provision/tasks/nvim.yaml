---
- name: "Install Nvim {{ nvim_ver }}"

  hosts: all

  vars:
    nvim_ver: "v0.12.1"
    nvim_dir: /opt/nvim-linux-x86_64

  vars_prompt:
    - name: ansible_become_pass
      prompt: BECOME password
      private: true

  tasks:
    - name: "Install Nvim deps"
      become: true
      ansible.builtin.package:
        name:
          - tar
          - git
          - make
          - gettext
          - ripgrep
          - fzf
          - xclip
          - npm # required to install some LSPs (e.g. bash, bitbake)
          - stow
          - tmux
          - golang
        state: latest

    - name: "Download Nvim {{ nvim_ver }} release artifact"
      ansible.builtin.get_url:
        url: "https://github.com/neovim/neovim/releases/download/{{ nvim_ver }}/nvim-linux-x86_64.tar.gz"
        dest: /tmp/nvim.tar.gz
        checksum: sha256:ab757a1fd9ad307d53d2df4045698906a7ca3993d92260dd8fe49108712d57d0

    - name: "Install Nvim {{ nvim_ver }} release artifact"
      become: true
      ansible.builtin.unarchive:
        remote_src: true
        src: /tmp/nvim.tar.gz
        dest: /opt

    - name: "Ensure nvim and plugin bins in PATH"
      ansible.builtin.lineinfile:
        path: ~/.bashrc
        regexp: "^export PATH=.*{{ item }}.*$"
        line: 'export PATH="${PATH}:{{ item }}"'
        state: present
      loop:
        - "{{ nvim_dir }}/bin"
        - "${HOME}/.local/share/nvim/mason/bin"

    - name: "Download IDE config"
      ansible.builtin.git:
        repo: "https://github.com/AlfredWilmot/dotfiles.git"
        dest: "{{ ansible_env['HOME'] }}/.dotfiles"
        version: dev #0.2.0

    - name: "Apply config via stow"
      ansible.builtin.command:
        cmd: stow --adopt --no-folding .
        chdir: "{{ ansible_env['HOME'] }}/.dotfiles"

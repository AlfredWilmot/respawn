name: Docker

on:
  push:
    branches: [ "main", "dev" ]
  release:
    types: [ "published" ]
# (https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows)
# (https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#github-context)

env:
  CONTAINER_REGISTRY: ghcr.io/${{ github.repository }}
  IMAGE_TAG: ${{ github.ref }}
  BUILDERS_YAML: "services/builders.yaml"

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge with sigstore/fulcio when signing images
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up BuildKit Docker container builder to be able to build multi-platform images
      # (https://github.com/docker/setup-buildx-action)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      # Login against a Docker registry except on PR
      # (https://github.com/docker/login-action)
      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Builder Images
        run: docker compose -f ${BUILDERS_YAML} build

      - name: Publish Docker Builder Images
        run: docker compose -f ${BUILDERS_YAML} publish

      - name: Install cosign
#       if: github.event_name == 'release'
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20 #v3.5.0
        with:
          cosign-release: 'v2.2.4'
      # (https://github.com/sigstore/cosign-installer)

      - name: Sign the published Docker image on Release
#       if: ${{ github.event_name == 'release' }}
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: |
          docker compose -f ${BUILDERS_YAML} config --images |
          while read -r image; do
            digest="$(docker buildx imagetools inspect "${image}" --format '{{json .Manifest.Digest}}')"
            cosign sign --yes ${image}@${digest}
          done
      # (https://github.com/sigstore/cosign)
      # (https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#using-an-intermediate-environment-variable)
